name: CI/CD

# Runs on every push and PR to main. The deploy job only runs on a push to
# main AND only after both build/test jobs pass — so untested code never
# reaches production (the live site stays on the last good version).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend: build + test against real Postgres (pgvector) + Redis ─────────
  backend-ci:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: commercepilot
          POSTGRES_PASSWORD: commercepilot_ci
          POSTGRES_DB: commercepilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commercepilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://commercepilot:commercepilot_ci@localhost:5432/commercepilot_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test
      # CI-only dummy secrets — never used against real infrastructure.
      JWT_SECRET: ci_only_dummy_jwt_secret_0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations to CI database
        run: npx prisma migrate deploy
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  # ── Frontend: lint + production build ──────────────────────────────────────
  frontend-ci:
    name: Frontend · build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Placeholder is fine for the build; the real value is set in Vercel.
          NEXT_PUBLIC_API_URL: https://example.com/api/v1

  # ── Deploy: backend to Render (only on green main pushes) ─────────────────
  # The frontend is deployed by Vercel's Git integration (production on main,
  # preview on every PR) — see DEPLOYMENT.md.
  deploy-backend:
    name: Deploy backend (Render)
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set yet — skipping deploy."
            exit 0
          fi
          echo "Triggering Render deploy…"
          curl -fsSL -X POST "$HOOK"
          echo "Render deploy triggered. Render will build, migrate, health-check, then swap."
